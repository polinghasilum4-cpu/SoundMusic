<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundMusic Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #667eea;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .search-box button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .search-box button:hover {
      background: #764ba2;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .playlist {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 30px;
    }

    .track-item {
      padding: 15px;
      margin-bottom: 10px;
      background: #f5f5f5;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .track-item:hover {
      background: #e8e8e8;
      transform: translateX(5px);
    }

    .track-item.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .track-title {
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .now-playing {
      text-align: center;
      margin-bottom: 20px;
    }

    .now-playing-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-artist {
      font-size: 13px;
      color: #999;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 60px;
      margin-bottom: 20px;
    }

    .bar {
      width: 4px;
      background: linear-gradient(to top, #667eea, #764ba2);
      border-radius: 2px;
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { height: 10px; }
      50% { height: 40px; }
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }
    .bar:nth-child(6) { animation-delay: 0.3s; }
    .bar:nth-child(7) { animation-delay: 0.2s; }
    .bar:nth-child(8) { animation-delay: 0.1s; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      margin-bottom: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #667eea, #764ba2);
      width: 0%;
      transition: width 0.1s linear;
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      background: #667eea;
      color: white;
    }

    button:hover {
      background: #764ba2;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .play-btn {
      padding: 12px 30px;
      font-size: 16px;
    }

    audio {
      width: 100%;
      margin-bottom: 15px;
    }

    .loading {
      text-align: center;
      color: #667eea;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎵 SoundMusic Player</h1>
      <p style="color: #999; font-size: 13px;">Cari dan dengarkan track favorit</p>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari track atau artist...">
      <button onclick="searchTracks()">Cari</button>
    </div>

    <div class="playlist" id="playlist"></div>

    <div class="player">
      <div class="now-playing">
        <div class="now-playing-title" id="currentTitle">Pilih track untuk diputar</div>
        <div class="now-playing-artist" id="currentArtist"></div>
      </div>

      <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <audio id="audioPlayer"></audio>

      <div class="controls">
        <button onclick="togglePlay()">▶️ Play / Pause</button>
        <button onclick="stopAudio()">⏹️ Stop</button>
      </div>
    </div>
  </div>

  <script>
    // Gunakan relative path untuk API calls di Vercel
    const API_URL = '/api';
    let currentTrackId = null;
    let tracks = [];

    async function searchTracks() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const playlist = document.getElementById('playlist');
      playlist.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const response = await fetch(`${API_URL}/search?q=${encodeURIComponent(query)}&limit=20`);
        const data = await response.json();
        tracks = data.collection || [];

        playlist.innerHTML = '';
        tracks.forEach((track, index) => {
          if (track.kind === 'track' && track.media?.transcodings) {
            const div = document.createElement('div');
            div.className = 'track-item';
            div.innerHTML = `
              <div class="track-title">${track.title}</div>
              <div class="track-artist">${track.user?.username || 'Unknown'}</div>
            `;
            div.onclick = () => playTrack(track, div);
            playlist.appendChild(div);
          }
        });
      } catch (error) {
        playlist.innerHTML = `<div class="loading">Error: ${error.message}</div>`;
      }
    }

    async function playTrack(track, element) {
      currentTrackId = track.id;
      document.getElementById('currentTitle').textContent = track.title;
      document.getElementById('currentArtist').textContent = track.user?.username || 'Unknown';

      // Highlight active track
      document.querySelectorAll('.track-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');

      try {
        const response = await fetch(`${API_URL}/stream?id=${track.id}`);
        const data = await response.json();
        
        const audio = document.getElementById('audioPlayer');
        audio.src = data.url;
        audio.play();

        audio.onloadedmetadata = () => {
          document.getElementById('duration').textContent = formatTime(audio.duration);
        };

        audio.ontimeupdate = () => {
          const percent = (audio.currentTime / audio.duration) * 100;
          document.getElementById('progressFill').style.width = percent + '%';
          document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        };
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function togglePlay() {
      const audio = document.getElementById('audioPlayer');
      if (audio.src) {
        audio.paused ? audio.play() : audio.pause();
      }
    }

    function stopAudio() {
      const audio = document.getElementById('audioPlayer');
      audio.pause();
      audio.currentTime = 0;
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchTracks();
    });
  </script>
</body>
</html>
